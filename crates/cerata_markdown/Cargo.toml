[package]
name = "cerata_markdown"
description = "Buffer, Markdown tree, decoration rules and editing commands for Cerata. No GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
memchr = "2"
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13"
ammonia = "4.2.4"
yaml-rust2 = { version = "0.13.0", default-features = false }
thiserror.workspace = true
unicode-properties = { version = "0.1.3", default-features = false, features = ["general-category"] }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
tree-sitter = "0.27.1"
tree-sitter-md = { version = "0.5.4", features = ["parser"] }

# US-003 throwaway parser spike (tree-sitter-md vs pulldown-cmark). `test = true`
# makes `cargo test` run its assertions; `--release` runs the measurements.
[[example]]
name = "parser_spike"
path = "examples/parser_spike.rs"
test = true
