[package]
name = "cerata_core"
description = "Files, workspace, index, watcher, settings and sessions for Cerata. No GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cerata_markdown.workspace = true
dirs = "6"
dunce = "1"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
log.workspace = true
notify = "7"
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash = "5"
getrandom = "0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
blake3 = "1.8.7"
zstd = { version = "0.14.3", default-features = false }
imara-diff = "0.2.0"
gethostname = "1.1.0"

[dev-dependencies]
tempfile.workspace = true
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
