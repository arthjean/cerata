[package]
name = "cerata_core"
description = "Files, workspace, index, watcher, settings and sessions for Cerata. No GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cerata_markdown.workspace = true
dirs = "6"
dunce = "1"
ignore = "0.4"
# Image signatures and headers for imports (US-059); same crate as GPUI.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
log.workspace = true
notify = "7"
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash = "5"
# Library ids (ADR 0009, US-076): 16 bytes from the OS.
getrandom = "0.3"
# The library store (ADR 0009, EP-017): SQLite compiled in, content hashes.
rusqlite = { version = "0.41.1", features = ["bundled"] }
blake3 = "1.8.7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
