[package]
name = "cerata"
description = "Native Markdown editor with live preview, built with Rust and GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
cerata_core.workspace = true
cerata_markdown.workspace = true
cerata_render = { path = "../cerata_render" }
# Local time for pasted image names and the insert commands.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.11"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui.workspace = true
gpui_platform.workspace = true
# Image headers (sizes before decoding); same crate and formats as GPUI.
image = { version = "0.25.10", default-features = false }
interprocess = "2.4"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr = "2"
thiserror.workspace = true
# HTTPS image fetches (`https_only`), as Paneflow does.
ureq = "3"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# US-002 throwaway spike of the editor engine (docs/adr/0001-editor-engine.md).
[[example]]
name = "editor_spike"
test = true
