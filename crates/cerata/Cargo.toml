[package]
name = "cerata"
description = "Native Markdown editor with live preview, built with Rust and GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
cerata_core.workspace = true
cerata_markdown.workspace = true
cerata_render = { path = "../cerata_render" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.11"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25.10", default-features = false }
interprocess = "2.4"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr = "2"
thiserror.workspace = true
ureq = "3"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[[example]]
name = "editor_spike"
test = true
