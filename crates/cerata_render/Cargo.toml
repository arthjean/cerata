[package]
name = "cerata_render"
description = "Rendering helpers with heavy dependencies for Cerata: tree-sitter code highlighting, diagrams and formulas. No GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cerata_markdown.workspace = true
log.workspace = true
# Diagrams (Pele) and formulas (MathJax) in an isolated QuickJS runtime
# (docs/adr/0005-diagram-and-math-rendering.md). No feature: no `std`/`os`
# module, no loader.
rquickjs = "0.14.0"
# Code highlighting: tree-sitter at the version the workspace already uses,
# and the grammar crates that ship a highlight query (all MIT). A language is
# one dependency plus one row in `src/highlight.rs`.
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.3.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.24.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-nix = "0.3.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.3"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

[lints]
workspace = true

# US-031 throwaway spike comparing the diagram and formula engines
# (docs/adr/0005-diagram-and-math-rendering.md). Behind a feature so the
# heavy candidates never reach `cargo test --workspace`:
# `cargo run -p cerata_render --example render_spike --features spike --release`.
[features]
spike = ["dep:mermaid-svg", "dep:mitex", "dep:typst", "dep:typst-svg", "dep:typst-layout", "dep:typst-assets", "dep:resvg"]

[dependencies.mermaid-svg]
version = "0.7.0"
optional = true

[dependencies.mitex]
version = "0.2.4"
optional = true

[dependencies.typst]
version = "0.15.1"
optional = true

[dependencies.typst-svg]
version = "0.15.1"
optional = true

[dependencies.typst-layout]
version = "0.15.1"
optional = true

[dependencies.typst-assets]
version = "0.15.1"
features = ["fonts"]
optional = true

[dependencies.resvg]
version = "0.46.0"
optional = true

[[example]]
name = "render_spike"
required-features = ["spike"]

[[example]]
name = "weight_base"
path = "examples/weight/base.rs"
required-features = ["spike"]

[[example]]
name = "weight_mermaid_svg"
path = "examples/weight/mermaid_svg.rs"
required-features = ["spike"]

[[example]]
name = "weight_pele"
path = "examples/weight/pele.rs"
required-features = ["spike"]

[[example]]
name = "weight_mathjax"
path = "examples/weight/mathjax.rs"
required-features = ["spike"]

[[example]]
name = "weight_pele_mathjax"
path = "examples/weight/pele_mathjax.rs"
required-features = ["spike"]

[[example]]
name = "weight_typst"
path = "examples/weight/typst.rs"
required-features = ["spike"]

[dev-dependencies]
serde_json.workspace = true
